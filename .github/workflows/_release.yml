on:
  workflow_call:

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
        binary:
          - name: agent
            path: ./cmd/agent/
          - name: pico-mac-sender
            path: ./cmd/pico-mac-sender/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.binary.name }}
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.binary.name }}-linux-${{ matrix.goarch }} ${{ matrix.binary.path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary.name }}-linux-${{ matrix.goarch }}
          path: ${{ matrix.binary.name }}-linux-${{ matrix.goarch }}

  release:
    needs: binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            agent-linux-amd64
            agent-linux-arm64
            pico-mac-sender-linux-amd64
            pico-mac-sender-linux-arm64
            scripts/install-agent.sh
            scripts/install-pico-mac-sender.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
