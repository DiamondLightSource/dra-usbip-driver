name: Build SD Card Image

on:
  workflow_dispatch:
    inputs:
      agent-version:
        description: "Release tag to install (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get -qq purge -y 'dotnet-*' 'aspnet*' 'mono-*' google-chrome-stable firefox 2>/dev/null || true
          sudo apt-get -qq autoremove -y 2>/dev/null || true
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          df -h /

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y qemu-user-static binfmt-support
          # Ensure qemu-aarch64 exists (build-docker.sh looks for it
          # by this name, but the package installs qemu-aarch64-static)
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/bin/qemu-aarch64
          # Verify
          qemu-aarch64 --version

      - name: Clone and configure pi-gen
        run: |
          git clone --depth 1 -b arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen

          # Copy our custom stage into pi-gen
          cp -r pi-gen-stage pi-gen/

          # Write pi-gen config
          cat > pi-gen/config <<EOF
          IMG_NAME=raspi-agent-server-${{ inputs.agent-version }}
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          COMPRESSION_LEVEL=6
          LOCALE_DEFAULT=en_GB.UTF-8
          TARGET_HOSTNAME=raspberrypi
          KEYBOARD_KEYMAP=gb
          KEYBOARD_LAYOUT="English (UK)"
          TIMEZONE_DEFAULT=Europe/London
          FIRST_USER_NAME=local
          FIRST_USER_PASS=local
          DISABLE_FIRST_BOOT_USER_RENAME=0
          ENABLE_SSH=1
          STAGE_LIST="stage0 stage1 stage2 ./pi-gen-stage"
          EOF

          # Skip image export for all stages except the last
          touch pi-gen/stage0/SKIP_IMAGES pi-gen/stage1/SKIP_IMAGES pi-gen/stage2/SKIP_IMAGES
          touch pi-gen/pi-gen-stage/EXPORT_IMAGE

      - name: Build Pi image
        run: |
          cd pi-gen
          sudo AGENT_VERSION=${{ inputs.agent-version }} ./build-docker.sh
        env:
          PIGEN_DOCKER_OPTS: -e AGENT_VERSION=${{ inputs.agent-version }}

      - name: Attach image to release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ inputs.agent-version }}
          files: pi-gen/deploy/*.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
