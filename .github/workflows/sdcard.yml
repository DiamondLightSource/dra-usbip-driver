name: Build SD Card Image

on:
  workflow_dispatch:
    inputs:
      agent-version:
        description: "Release tag to install (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build SD card image
        run: .github/scripts/build-sdcard.sh
        env:
          AGENT_VERSION: ${{ inputs.agent-version }}

      - name: Unmount
        if: always()
        run: |
          sudo umount /mnt/dev/pts || true
          sudo umount /mnt/dev || true
          sudo umount /mnt/sys || true
          sudo umount /mnt/proc || true
          sudo umount /mnt/boot/firmware || true
          sudo umount /mnt || true
          [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" || true

      - name: Shrink and compress image
        run: |
          curl -fsSL -o pishrink.sh https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
          chmod +x pishrink.sh
          sudo ./pishrink.sh raspi.img || true

          mv raspi.img raspi-agent-server-${{ inputs.agent-version }}.img
          xz -3 raspi-agent-server-${{ inputs.agent-version }}.img

      - name: Attach image to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.agent-version }}
          files: raspi-agent-server-${{ inputs.agent-version }}.img.xz
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
